<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaAgro - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <main class="login-container">
        <section class="banner-section">
            <img src="" alt="Plantação e mãos na terra" class="banner-bg-img">
            <div class="banner-overlay"></div>
            
            <div class="banner-content">
                <div class="logo-container">
                    <img src="" alt="Ícone ConectaAgro" class="logo-icon">
                    <h1 class="logo-text">ConectaAgro</h1>
                </div>
                <h2 class="banner-tagline">
                    Conectando o agro,<br>
                    gerando valor para<br>
                    você e o Brasil!
                </h2>
            </div>
        </section>

        <section class="form-section">
            <div class="form-wrapper">
                <header class="form-header">
                    <h1 class="welcome-title">Bem Vindo!</h1>
                    <p class="welcome-subtitle">Acesse sua conta para continuar</p>
                </header>

                <form id="loginForm" class="login-form">
                    <div class="input-group">
                        <label for="username">Nome de Usuário</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="actions-group">
                        <button type="submit" class="btn-submit">Entrar</button>
                    </div>
                </form>

                <footer class="form-footer">
                    <p>Ainda não tem uma conta?<br>
                    <a href="#" class="register-link">Cadastre-se!</a></p>
                </footer>
            </div>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
